<script>
const ua=navigator.userAgent,isSmartTV=/Tizen|Web0S|SmartTV|SMART-TV|Roku|AppleTV/i.test(ua),isMobile=/Mobi|Android|iPhone|iPad/i.test(ua)&&!isSmartTV;
if(isSmartTV)document.body.classList.add('tv-mode');

const grid=document.getElementById('channelGrid'),categoryContainer=document.getElementById('categoryContainer'),appContainer=document.getElementById('appContainer'),playerContainer=document.getElementById('playerContainer'),videoWrapper=document.getElementById('videoWrapper'),sidebarList=document.getElementById('sidebarList');
let allChannels=[],activeCategory=window.location.hash?decodeURIComponent(window.location.hash.substring(1).split('/')[0]):'All',genres=new Set();
let defaultFavs=["Sony SAB SD","Sony Pal 2","Disney Channel","Hungama TV","Sony Yay","Hungama Super","Sony SAB HD","Colors HD","Colors Rishtey","MTV HD"],favorites=defaultFavs.slice();
try{const p=localStorage.getItem('tvFavsV2');if(p!==null){const a=JSON.parse(p);if(Array.isArray(a))favorites=a}}catch(e){}
const pal2Idx=favorites.indexOf("Sony Pal");if(pal2Idx!==-1){favorites[pal2Idx]="Sony Pal 2";localStorage.setItem('tvFavsV2',JSON.stringify(favorites))}

const INITIAL_RENDER_COUNT=36,RENDER_BATCH_SIZE=36;let visibleRenderCount=INITIAL_RENDER_COUNT,currentFilteredChannels=[],renderObserver=null;

const PLACEHOLDER_IMG='data:image/svg+xml;charset=UTF-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="60" height="60"><rect width="60" height="60" rx="10" fill="#000"/><text x="30" y="36" text-anchor="middle" font-size="18" fill="#fff">TV</text></svg>');

function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function getFilteredChannels(){if(activeCategory==='Favorites'){const m=new Map(allChannels.map(c=>[c.name,c]));return favorites.map(n=>m.get(n)).filter(Boolean)}return allChannels.filter(c=>activeCategory==='All'||c.genre===activeCategory)}
function setupGridObserver(){if(renderObserver)renderObserver.disconnect();const s=document.getElementById('gridSentinel');if(!s||!('IntersectionObserver'in window))return;renderObserver=new IntersectionObserver(es=>{if(es.some(e=>e.isIntersecting)&&visibleRenderCount<currentFilteredChannels.length){visibleRenderCount+=RENDER_BATCH_SIZE;renderGrid(false)}},{root:appContainer,rootMargin:'700px 0px'});renderObserver.observe(s)}
function getFullscreenElement(){return document.fullscreenElement||document.webkitFullscreenElement||document.mozFullScreenElement||document.msFullscreenElement}
function applyLandscapeLock(){if(isMobile){try{if(screen.orientation?.lock)screen.orientation.lock('landscape').catch(()=>{});else if(screen.lockOrientation)screen.lockOrientation('landscape');}catch(e){}}}

function exitFullscreenLogic(){if(isMobile){videoWrapper.classList.remove('mobile-fullscreen');isPseudoFullscreen=false;updateFullscreenUI()}else document.exitFullscreen?.()}

function finishSetup(){
 let h=window.location.hash?decodeURIComponent(window.location.hash.substring(1)):'All';
 if(h.includes('stream=')){let p=h.includes('/stream=')?h.split('/stream='):[null,h.replace('stream=','')];activeCategory=p[0]||'All';if(!genres.has(activeCategory))activeCategory='All';renderCategories();renderGrid();const c=allChannels.find(x=>x.name===p[1]);if(c)openStream(c.link,c.name,true);return}
 if(!genres.has(h)&&h!=='All'){activeCategory='All';location.hash='All'}else activeCategory=h;
 renderCategories();renderGrid()
}
function renderCategories(){
 const order=['All','Favorites','Fun-Ment','Movies','Sports','Kids','Info','News','Music','Regional'];
 let html=order.filter(g=>genres.has(g)).map(g=>`<button class="chip ${activeCategory===g?'active':''}" data-genre="${g}" onclick="setCategory('${g}')">${categoryIcons[g]||'📺'} ${g}</button>`).join('');
 if(isMobile)html+=`<button class="chip backup-btn" onclick="shareFavorites()">🔗 Backup Favs</button>`;
 if(!isMobile)html+=`<button class="chip" onclick="toggleAutoFS()">⚙️ Auto-FS: ${isAutoFS?'ON':'OFF'}</button>`;
 categoryContainer.innerHTML=html
}

 if(playerContainer.style.display==='flex'){clearTimeout(autoFsTimer);const i=document.getElementById('playerIframe'),v=document.getElementById('playerVideo');if(i)i.src='about:blank';if(v){v.pause();v.removeAttribute('src');v.load()}document.getElementById('mediaContainer').innerHTML='';playerContainer.style.display='none';appContainer.style.display='flex';if(getFullscreenElement()||isPseudoFullscreen)exitFullscreenLogic()}

});

function toggleFav(name,btn){const i=favorites.indexOf(name);if(i>-1){favorites.splice(i,1);btn.innerHTML='🤍';showToast('Removed from Favs')}else{favorites.push(name);btn.innerHTML='❤️';showToast('Saved to Favs!')}localStorage.setItem('tvFavsV2',JSON.stringify(favorites));if(activeCategory==='Favorites')renderGrid()}
function renderGrid(reset=true){
 if(reset)visibleRenderCount=INITIAL_RENDER_COUNT;currentFilteredChannels=getFilteredChannels();
 if(!currentFilteredChannels.length){if(renderObserver)renderObserver.disconnect();grid.innerHTML=activeCategory==='Favorites'?'<div class="msg">No Favs yet. Tap the heart on a channel to save it!</div>':'<div class="msg">No channels found.</div>';return}
 const visible=currentFilteredChannels.slice(0,visibleRenderCount);let html='';
 visible.forEach(c=>{const i=allChannels.indexOf(c),fav=favorites.includes(c.name);html+=`<div class="card" tabindex="0" data-channel-index="${i}" data-name="${escapeHtml(c.name)}">${isMobile?`<button class="fav-btn" tabindex="-1">${fav?'❤️':'🤍'}</button>`:''}<div class="live">LIVE</div><img src="${escapeHtml(c.image)}" loading="lazy" width="46" height="46" onerror="this.onerror=null;this.src='${PLACEHOLDER_IMG}'"><h3>${escapeHtml(c.name)}</h3><p>${escapeHtml(c.genre)}</p></div>`});
 if(activeCategory==='All')infinityApps.forEach(a=>html+=`<a href="${escapeHtml(a.url)}" target="_blank" rel="noopener noreferrer" class="card app-card" style="background:${a.grad};justify-content:center;padding-top:18px"><div style="font-size:28px">${a.icon}</div><h3 style="color:#fff">${escapeHtml(a.name)}</h3><p style="color:#fff">APP</p></a>`);
 html+='<div id="gridSentinel" style="grid-column:1/-1;height:1px"></div>';grid.innerHTML=html;setupGridObserver()
}
function showToast(msg){const t=document.getElementById('toastMsg');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000)}
function shareFavorites(){if(!favorites.length)return showToast('No favs to backup!');const u=location.origin+location.pathname+'?favs='+encodeURIComponent(JSON.stringify(favorites));try{navigator.clipboard?.writeText(u);showToast('Copied! Paste to save.')}catch(e){location.href=u}}
function renderSidebar(active){
 const title=document.getElementById('sidebarCategoryTitle');if(title)title.textContent=(activeCategory==='All'?'ALL':activeCategory.toUpperCase())+' CHANNELS';
 const list=activeCategory==='Favorites'?favorites.map(n=>allChannels.find(c=>c.name===n)).filter(Boolean):allChannels.filter(c=>activeCategory==='All'||c.genre===activeCategory);
 const html=list.map(c=>{const i=allChannels.indexOf(c);return`<div class="yt-list-item ${c.name===active?'active':''}" tabindex="0" data-channel-index="${i}"><div class="flex items-center gap-3"><img src="${escapeHtml(c.image)}" loading="lazy" width="38" height="38" onerror="this.onerror=null;this.src='${PLACEHOLDER_IMG}'"><div><span class="text-[12px] font-semibold text-slate-200">${escapeHtml(c.name)}</span><div class="text-[8px] text-slate-400 uppercase">${escapeHtml(c.genre)}</div></div></div><div class="active-dot"></div></div>`}).join('');
 sidebarList.innerHTML=html;document.getElementById('fsSidebarList').innerHTML=html
}
sidebarList.addEventListener('click',e=>{const item=e.target.closest('.yt-list-item');if(item){const c=allChannels[Number(item.dataset.channelIndex)];if(c)openStream(c.link,c.name)}});
document.getElementById('fsSidebarList').addEventListener('click',e=>{const item=e.target.closest('.yt-list-item');if(item){const c=allChannels[Number(item.dataset.channelIndex)];if(c)openStream(c.link,c.name);toggleFsSidebar()}});

let dashLoaderPromise=null;
function loadDashJs(){if(window.dashjs)return Promise.resolve(window.dashjs);if(dashLoaderPromise)return dashLoaderPromise;dashLoaderPromise=new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='https://cdn.dashjs.org/latest/dash.all.min.js';s.onload=()=>resolve(window.dashjs);s.onerror=reject;document.head.appendChild(s)});return dashLoaderPromise}
function openStream(url,name,fromHash=false){
 if(!fromHash){location.hash=activeCategory+'/stream='+encodeURIComponent(name);return}
 if(url.includes('.mpd')){document.getElementById('mediaContainer').innerHTML='<video id="playerVideo" controls autoplay style="width:100%;height:100%;background:#000"></video>';loadDashJs().then(d=>{const p=d.MediaPlayer().create();p.initialize(document.getElementById('playerVideo'),url,true)}).catch(console.error)}
 else{const final=url+(url.includes('?')?'&':'?')+'autoplay=1&mute=1';document.getElementById('mediaContainer').innerHTML=`<iframe id="playerIframe" src="${escapeHtml(final)}" allow="autoplay;encrypted-media;picture-in-picture" sandbox="allow-scripts allow-same-origin" style="width:100%;height:100%;border:none"></iframe>`}
 appContainer.style.display='none';playerContainer.style.display='flex';isStreamPlaying=true;document.getElementById('playPauseBtn').textContent='Ⅱ';renderSidebar(name);
 if(isAutoFS){clearTimeout(autoFsTimer);autoFsTimer=setTimeout(()=>{if(!getFullscreenElement()&&!isPseudoFullscreen&&playerContainer.style.display==='flex')enterFullscreenLogic()},5000)}
}
function closePlayer(){location.hash=activeCategory}
function togglePlayPause(){const v=document.getElementById('playerVideo'),f=document.getElementById('playerIframe'),b=document.getElementById('playPauseBtn');if(isStreamPlaying){if(v)v.pause();else if(f){f.dataset.savedSrc=f.src;f.src='about:blank'}b.textContent='▶';isStreamPlaying=false;showToast('Stream Paused.')}else{if(v)v.play();else if(f&&f.dataset.savedSrc)f.src=f.dataset.savedSrc;b.textContent='Ⅱ';isStreamPlaying=true;showToast('Resuming Live Stream...')}}
function toggleFsSidebar(){document.getElementById('fsSidebar').classList.toggle('-translate-x-full')}
function updateFullscreenUI(){const o=document.getElementById('fsOverlay'),show=!!getFullscreenElement()||isPseudoFullscreen;o.style.display=show?'block':'none';if(!show)document.getElementById('fsSidebar').classList.add('-translate-x-full');else applyLandscapeLock()}
function safeRequestFullscreen(el,cb){try{let p=el.requestFullscreen?.()||el.webkitRequestFullscreen?.()||el.mozRequestFullScreen?.()||el.msRequestFullscreen?.();if(p?.catch)p.catch(()=>cb?.());else if(!p)cb?.()}catch(e){cb?.()}}
document.addEventListener('fullscreenchange',updateFullscreenUI);
document.addEventListener('webkitfullscreenchange',updateFullscreenUI);
window.addEventListener('keydown',e=>{if([27,461,10009].includes(e.keyCode)||e.key==='Escape'){if(playerContainer.style.display==='flex'){if(getFullscreenElement()||isPseudoFullscreen)exitFullscreenLogic();else closePlayer()}}});
fetchData();
